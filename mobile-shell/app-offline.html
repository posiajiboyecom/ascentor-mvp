<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Ascentor</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #FAFAF8; color: #161616;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
  }
  main { width: 100%; max-width: 360px; text-align: center; }
  .mark { width: 72px; height: 72px; margin: 0 auto 28px; display: block; }
  h1 { margin: 0 0 10px; font-size: 24px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em; }
  p { margin: 0 0 28px; font-size: 15px; line-height: 1.5; color: #5F6672; }
  button {
    width: 100%; min-height: 52px; border: 0; border-radius: 10px;
    background: #B6502A; color: #fff; font: inherit; font-size: 15px; font-weight: 600;
  }
  button:active { filter: brightness(0.94); }
  button[disabled] { opacity: 0.6; }
  .rule { width: 44px; height: 3px; background: #CAA228; margin: 0 auto 22px; border-radius: 2px; }
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 1024 1024" aria-hidden="true">
    <rect width="1024" height="1024" rx="184" fill="#0C0B08"/>
    <g transform="translate(1.51 127.59) scale(7.6)" fill="#fff">
      <path d="M105.19,71.38H57l-2.73,6.11h53.63ZM83.83,23.62H78.37L58.82,67.39h44.59Zm-2.7,16.32,7.93,18.63H73.19Z"/><path d="M74.64,23.64L55.14,67.39L53.36,71.38L50.62,77.54L44.92,77.54L47.66,71.38L49.44,67.39L68.95,23.64Z"/><path d="M65.42,23.64L41.39,77.54L35.69,77.54L59.72,23.64Z"/><path d="M56.12,23.64L36.61,67.39L34.83,71.38L32.09,77.54L26.39,77.54L29.14,71.38L30.92,67.39L50.42,23.64Z"/>
    </g>
  </svg>
  <div class="rule"></div>
  <h1>No connection</h1>
  <p>Ascentor needs the internet to open. Check your signal or Wi-Fi, then try again.</p>
  <button id="retry" type="button">Try again</button>
</main>
<script>
  (function () {
    // The app itself lives on the live site; this screen is bundled only for when it cannot be reached.
    var APP = 'https://joinascentor.com/dashboard';
    var btn = document.getElementById('retry');
    function go() {
      btn.disabled = true;
      btn.textContent = 'Connecting';
      window.location.replace(APP);
    }
    btn.addEventListener('click', go);
    // Reopen on its own as soon as the phone is back online.
    window.addEventListener('online', go);
  })();
</script>
</body>
</html>
